<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="turfe.css">
    <title>Turfe</title>
</head>

<body>
    <h2 class="titulo">Turfe - corrida de cavalos</h2>
    <div class="container">
        <div c></div>
        <div class="texto">
            Inserir Quantidade de Cavalo
        </div>
        <select name="cavalos" id="select_qtd_cavalo">
            <br>
            <option value="selecione">Selecione..</option>
            <option value="3">2</option>
            <option value="4">3</option>
            <option value="5">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
        </select> <br>
        <div class="texto">
            Inserir Quantidade de Voltas
        </div>
        <select name="voltas" id="select_voltas">
            <br>
            <option value="selecione">Selecione..</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select> <br>

        <button class="botao" onclick="Corrida()">Cadastrar Corrida</button><br>
        <div class="texto">
            Inserir nome dos cavalos<br><br>
        </div>
        <input type="text" id="ipt_nome">
        <br>
        <button class="botao" onclick="cadastrarcavalos()">Cadastrar Cavalo</button><br>
        <button class="botao" onclick="volta()">Dar uma volta</button> <br><br>
        <div class="caixa">
            <div id="div_msg"></div>
        </div>

        <button class="botao" onclick="podio()">Exibir Pódio</button>
    </div>
</body>

</html>
<script>

    let nomecavalos = [];
    let resultados = [];
    let qtdVoltas = 0;

    function Corrida() {

        nomecavalos = [];
        resultados = [];

        let qtd_cavalos = Number(select_qtd_cavalo.value);
        let qtdVoltas = Number(select_voltas.value);

        let erro = false;

        if (select_qtd_cavalo.value == "") {
            div_msg.innerHTML = "Selecione a quantidade de cavalos.";
            erro = true;
        }

        if (select_voltas.value == "") {
            div_msg.innerHTML = "Selecione a quantidade de voltas.";
            erro = true;
        }

        if (qtd_cavalos < 2 || qtd_cavalos > 6) {
            div_msg.innerHTML = "A quantidade de cavalos deve ser entre 2 e 6.";
            erro = true;
        }

        if (qtdVoltas < 5 || qtdVoltas > 10) {
            div_msg.innerHTML = "A quantidade de voltas deve ser entre 5 e 10.";
            erro = true;
        }

        if (erro == false) {

            for (let i = 0; i < qtd_cavalos; i++) {
                nomecavalos.push("");
            }

            div_msg.innerHTML =
                `Corrida criada com ${qtd_cavalos} cavalos e ${qtdVoltas} voltas.`;
        }
    }


    function cadastrarcavalos() {

        let nome = ipt_nome.value.trim();
        let erro = false;

        if (nomecavalos.length == 0) {
            alert("Cadastre uma corrida primeiro.");
            erro = true;
        }

        if (nome == "") {
            alert("Digite o nome do cavalo.");
            erro = true;
        }

        if (erro == false) {

            let cadastrado = false;

            for (let i = 0; i < nomecavalos.length; i++) {

                if (nomecavalos[i] == "" && cadastrado == false) {

                    nomecavalos[i] = nome;

                    div_msg.innerHTML =
                        `Cavalo ${nome} cadastrado com sucesso!`;

                    ipt_nome.value = "";

                    cadastrado = true;
                }
            }

            if (cadastrado == false) {
                div_msg.innerHTML =
                    "Todos os cavalos já foram cadastrados.";
            }
        }
    }

    function volta() {

        let ax_volta = false

        for (let i = 0; i < nomecavalos.length; i++) {
            if (nomecavalos[i] == '') {
                ax_volta = true
            }
        }
        if(ax_volta == false){
            for(let i = 0; i < qtdVoltas; i ++){
        div_msg.innerHTML += `<br>Volta ${i + 1} <br>`
            }
    }
    else{
        div_msg.innerHTML = "Ainda falta competidores para preencher as vagas!"
    }
}

    function podio() {

        if (resultados.length == 0) {

            div_msg.innerHTML =
                "Realize a corrida antes de exibir o pódio.";

        } else {

            resultados.sort(function (a, b) {
                return a.tempo - b.tempo;

            });

            div_msg.innerHTML = "<h3>Pódio da Corrida</h3>";

            if (resultados.length >= 1) {
                div_msg.innerHTML +=
                    `1º Lugar: ${resultados[0].nome}
                (${resultados[0].tempo.toFixed(1)}s)<br><br>`;
            }

            if (resultados.length >= 2) {
                div_msg.innerHTML +=
                    `2º Lugar: ${resultados[1].nome}
                (${resultados[1].tempo.toFixed(1)}s)<br><br>`;
            }

            if (resultados.length >= 3) {
                div_msg.innerHTML +=
                    `3º Lugar: ${resultados[2].nome}
                (${resultados[2].tempo.toFixed(1)}s)`;
            }
        }
    }

</script>
